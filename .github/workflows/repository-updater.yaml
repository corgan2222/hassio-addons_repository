---
name: Repository Updater

# yamllint disable-line rule:truthy
on:
  repository_dispatch:
    types: ["update"]

permissions:
  contents: read

# A stable release dispatches both "stable" and "beta" into this same store
# repo, so two update events arrive almost simultaneously. Serialize them so
# they don't race on the master push (the second waits for the first).
concurrency:
  group: repository-updater
  cancel-in-progress: false

jobs:
  workflows:
    uses: hassio-addons/workflows/.github/workflows/repository-updater.yaml@3846ae0fd09acec8ac1ac308ceacd052b9d01bec # v2.0.6
    secrets:
      UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}

  changelog:
    name: Update changelog
    needs: workflows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      added: ${{ steps.prepend.outputs.added }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.UPDATER_TOKEN }}
          ref: master

      - name: Pull latest (updater may have pushed a commit)
        run: git pull --rebase --autostash

      - name: Prepend changelog entry
        id: prepend
        env:
          GH_TOKEN: ${{ secrets.UPDATER_TOKEN }}
          VERSION: ${{ github.event.client_payload.version }}
          REPOSITORY: ${{ github.event.client_payload.repository }}
          ADDON: ${{ github.event.client_payload.app }}
        run: |
          echo "added=false" >> "$GITHUB_OUTPUT"

          # Skip if VERSION is a git SHA (edge builds) rather than a release tag
          if [[ ! "${VERSION}" =~ ^v[0-9] ]]; then
            echo "Version '${VERSION}' is not a release tag, skipping changelog."
            exit 0
          fi

          CHANGELOG="${ADDON}/CHANGELOG.md"

          # Idempotent: the stable + beta dispatches both land here, so skip if
          # this version's entry already exists (prevents duplicate entries).
          if [[ -f "${CHANGELOG}" ]] && grep -qF "## ${VERSION} (" "${CHANGELOG}"; then
            echo "Changelog already contains ${VERSION}, skipping."
            exit 0
          fi

          DATE=$(date +%Y-%m-%d)

          # Fetch release notes from the addon repo
          NOTES=$(gh api "repos/${REPOSITORY}/releases/tags/${VERSION}" --jq '.body // ""')

          # Prepend the new entry. printf '%s' keeps the release notes literal
          # (never interpreted as a printf format string).
          TMP=$(mktemp)
          {
            printf '## %s (%s)\n\n' "${VERSION}" "${DATE}"
            printf '%s\n\n' "${NOTES}"
            [[ -f "${CHANGELOG}" ]] && cat "${CHANGELOG}"
          } > "${TMP}"
          mv "${TMP}" "${CHANGELOG}"

          echo "added=true" >> "$GITHUB_OUTPUT"

      - name: Commit changelog
        if: steps.prepend.outputs.added == 'true'
        env:
          VERSION: ${{ github.event.client_payload.version }}
          ADDON: ${{ github.event.client_payload.app }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${ADDON}/CHANGELOG.md"
          git diff --staged --quiet || git commit -m ":books: Update changelog for ${VERSION}"
          git push

  announce:
    name: Announce app update
    needs: [workflows, changelog]
    if: needs.changelog.outputs.added == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Announce on Discord server
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          username: ${{ github.event.client_payload.name }}
          avatar_url: |
            https://raw.githubusercontent.com/${{ github.repository }}/master/${{ github.event.client_payload.app }}/icon.png
          title: ":arrow_up: ${{ github.event.client_payload.name }} ${{ github.event.client_payload.version }}"
          image: |
            https://raw.githubusercontent.com/${{ github.repository }}/master/${{ github.event.client_payload.app }}/logo.png
          description: |
            A new version of the ${{ github.event.client_payload.name }} app has been published.

            **Version**: `${{ github.event.client_payload.version }}`
            **Release notes**:
            <https://github.com/${{ github.event.client_payload.repository }}/releases/tag/${{ github.event.client_payload.version }}>
